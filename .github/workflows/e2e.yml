name: E2E Workflows (Playwright)

on:
  push:
    branches: [main, devin/audit-remediation, devin/contractor-lifecycle]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright E2E — every spec, both viewports
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: construction_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Patch @react-pdf/hyphenate exports
        run: node scripts/patch-hyphenate.cjs

      - name: Create e2e database roles
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d construction_e2e <<'SQL'
            DO $$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'db_migrator') THEN
                CREATE ROLE db_migrator WITH LOGIN PASSWORD 'migrator_secret';
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'db_app') THEN
                CREATE ROLE db_app WITH LOGIN PASSWORD 'app_secret';
              END IF;
            END $$;
            GRANT ALL PRIVILEGES ON DATABASE construction_e2e TO db_migrator;
            GRANT USAGE ON SCHEMA public TO db_app;
          SQL

      - name: Install Playwright browsers
        run: pnpm --filter @construction/e2e exec playwright install --with-deps chromium

      - name: Verify aud-* spec integrity (sha256)
        # The four auditor acceptance specs are immutable contracts. Any
        # change — even one character — fails this step before tests run.
        # Changing aud-specs.sha256 itself requires owner review (CODEOWNERS)
        # and must be called out in the PR description (see AGENTS.md).
        working-directory: e2e/tests
        run: sha256sum -c aud-specs.sha256

      - name: Verify aud-* spec set is complete and unskipped
        run: |
          set -e
          count=$(ls e2e/tests/aud-*.spec.ts 2>/dev/null | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "FAIL: expected at least 5 aud-*.spec.ts files, found $count"
            exit 1
          fi
          if grep -nE 'test\.(skip|fixme|only)\s*\(' e2e/tests/aud-*.spec.ts; then
            echo "FAIL: aud-* specs must not contain test.skip / test.fixme / test.only"
            exit 1
          fi
          echo "aud-* spec set OK: $count files, no skips/fixmes/only"

      - name: Run every Playwright spec (chromium + mobile-390)
        env:
          E2E_DATABASE_URL: postgresql://db_app:app_secret@localhost:5432/construction_e2e
          E2E_MIGRATOR_DATABASE_URL: postgresql://db_migrator:migrator_secret@localhost:5432/construction_e2e
          E2E_ADMIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/construction_e2e
        # No spec filter: `playwright test` discovers every *.spec.ts under
        # e2e/tests and runs each on both configured projects.
        run: pnpm --filter @construction/e2e test:e2e

      - name: Fail if any spec was skipped
        if: always()
        run: |
          node -e "
            const r = require('./e2e/test-results/results.json');
            const skipped = (r.stats && r.stats.skipped) || 0;
            if (skipped > 0) {
              console.error('CI policy: skipped specs are not allowed — ' + skipped + ' test(s) skipped');
              process.exit(1);
            }
            console.log('No skipped specs.');
          "

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
