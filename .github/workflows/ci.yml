name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret Scanning (Check for live secrets in committed files)
        run: |
          if git grep -E "(BEGIN (RSA|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|SG\.[0-9a-zA-Z_-]{22}\.[0-9a-zA-Z_-]{43})" -- ':!*.example' ':!*.md'; then
            echo "::error::Potential secret detected in committed files!"
            exit 1
          fi

      - name: Run Linter
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Unit & Integration Tests
        run: pnpm run test
