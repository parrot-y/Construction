name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: construction_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Brand check (no legacy/competitor names in shipped source)
        run: bash scripts/check-brand.sh

      - name: Secret Scanning (Check for live secrets in committed files)
        run: |
          if git grep -E "(BEGIN (RSA|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|SG\.[0-9a-zA-Z_-]{22}\.[0-9a-zA-Z_-]{43})" -- ':!*.example' ':!*.md'; then
            echo "::error::Potential secret detected in committed files!"
            exit 1
          fi

      - name: Setup Database Roles & Schema
        env:
          PGPASSWORD: postgrespassword
        run: |
          # 1. Create db_migrator and db_app roles
          psql -h localhost -U postgres -d construction_test -c "
            DO \$\$ BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'db_migrator') THEN
                CREATE ROLE db_migrator WITH LOGIN PASSWORD 'migrator_secret' CREATEDB;
              END IF;
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'db_app') THEN
                CREATE ROLE db_app WITH LOGIN PASSWORD 'app_secret';
              END IF;
            END \$\$;
            GRANT ALL PRIVILEGES ON DATABASE construction_test TO db_migrator;
            GRANT ALL PRIVILEGES ON SCHEMA public TO db_migrator;
          "

          # 2. Apply real Prisma migrations as db_migrator from an empty database (audit P1.4)
          DATABASE_URL="postgresql://db_migrator:migrator_secret@localhost:5432/construction_test?schema=public" \
          pnpm --filter @construction/db exec prisma migrate deploy

          # 3. Grant schema permissions to db_app AFTER tables exist, and configure default privileges for db_migrator (C5)
          psql -h localhost -U postgres -d construction_test -c "
            GRANT USAGE ON SCHEMA public TO db_app;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO db_app;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO db_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE db_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO db_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE db_migrator IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO db_app;
          "

          # 4. Apply Row-Level Security, Ledger Immutability, and Triggers (C4, R-014, R-024)
          psql -h localhost -U postgres -d construction_test -f packages/db/prisma/rls.sql

          # 5. Seed Database
          DATABASE_URL="postgresql://db_migrator:migrator_secret@localhost:5432/construction_test?schema=public" \
          pnpm --filter @construction/db run prisma:seed

      - name: Run Linter
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Build All Packages
        run: pnpm run build

      - name: Demo-credential bundle check (VITE_DEMO_MODE unset)
        # The production build must not contain seeded demo logins or the
        # demo password — they are compile-time gated behind
        # VITE_DEMO_MODE === 'true' and dead-code-eliminated otherwise.
        run: bash scripts/check-demo-bundle.sh

      - name: Initial JS bundle budget (C2)
        # Entry chunks must stay ≤450KB raw / ≤140KB gzip — route-level
        # React.lazy keeps heavy modules out of the initial payload.
        run: bash scripts/check-bundle-size.sh

      - name: Security Vulnerability Audit
        run: pnpm audit --prod --audit-level=high

      - name: Run Unit & Integration Tests (App Role & RLS Isolation)
        env:
          DATABASE_URL: postgresql://db_app:app_secret@localhost:5432/construction_test?schema=public
        run: pnpm run test --force
